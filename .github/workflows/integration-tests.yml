name: Integration Tests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  STALWART_ADMIN_PWD: "secretpassword"
  # Must satisfy Stalwart's default zxcvbn password policy and match tests/resources/services.json (service1, service2)
  STALWART_USER_PWD: "violet-harbor-cactus-lantern"
  STALWART_USER2_PWD: "amber-glacier-pocket-thunder"

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      stalwart:
        image: stalwartlabs/stalwart:v1.1.0
        env:
          STALWART_RECOVERY_ADMIN: admin:${{ env.STALWART_ADMIN_PWD }}
          # Base URL of the published JMAP discovery URLs (apiUrl/downloadUrl/uploadUrl),
          # otherwise https://<defaultHostname> on port 443
          STALWART_PUBLIC_URL: http://localhost:8080
        ports:
          - 8080:8080

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.5"]

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision Stalwart
        env:
          STALWART_CONTAINER: ${{ job.services.stalwart.id }}
        run: |
          set -euo pipefail
          jmap() {
            jq -nc --argjson call "$1" '{using: ["urn:ietf:params:jmap:core", "urn:stalwart:jmap"], methodCalls: [$call]}' \
              | curl -sSf -u "admin:$STALWART_ADMIN_PWD" -H 'Content-Type: application/json' -d @- http://localhost:8080/jmap/ \
              | jq -e '.methodResponses[0] | if .[0] == "error" or ((.[1].notCreated // .[1].notUpdated // {}) | length > 0) then error(tojson) else .[1] end'
          }
          wait_for() {
            timeout 120 sh -c "until curl -sf '$1' > /dev/null; do sleep 2; done"
          }

          # A fresh server starts in bootstrap mode and only accepts the Bootstrap object
          wait_for http://localhost:8080/healthz/live
          jmap '["x:Bootstrap/set", {"update": {"singleton": {
            "defaultHostname": "mail.example1.com",
            "defaultDomain": "example1.com",
            "requestTlsCertificate": false,
            "generateDkimKeys": false,
            "tracer": {"@type": "Stdout"}
          }}}, "0"]'

          # The configuration written by the bootstrap is only loaded on restart
          docker restart "$STALWART_CONTAINER"
          wait_for http://localhost:8080/healthz/ready

          domain_id=$(jmap '["x:Domain/query", {"filter": {"name": "example1.com"}}, "0"]' | jq -er '.ids[0]')
          jmap "$(jq -nc --arg domain "$domain_id" --arg pwd1 "$STALWART_USER_PWD" --arg pwd2 "$STALWART_USER2_PWD" '["x:Account/set", {"create": {
            "u1": {
              "@type": "User",
              "name": "user1",
              "domainId": $domain,
              "credentials": {"0": {"@type": "Password", "secret": $pwd1}}
            },
            "u2": {
              "@type": "User",
              "name": "user2",
              "domainId": $domain,
              "credentials": {"0": {"@type": "Password", "secret": $pwd2}}
            }
          }}, "0"]')"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run integration tests
        run: composer test:integration

      - name: Print Stalwart logs
        if: ${{ failure() }}
        run: docker logs ${{ job.services.stalwart.id }}

  integration-test:
    runs-on: ubuntu-latest
    needs: integration

    name: Integration Test

    steps:
      - name: Integration test matrix passed
        run: echo "All integration test matrix jobs passed."
